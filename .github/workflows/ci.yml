name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치의 연속 push는 이전 run을 취소해 러너 자원을 절약한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GOLANGCI_LINT_VERSION: v2.13.2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "포맷 필요: $unformatted"
            exit 1
          fi

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: vet
        run: go vet ./...

      # Makefile test-cov와 동일 계량식(-coverpkg=./...)으로 커버리지를 측정한다.
      - name: test
        run: go test ./... -race -count=1 -coverpkg=./... -coverprofile=coverage.out

      # 실측 기준(초기 67.7%) 여유의 하한선 — 수치는 주석 없이 COVERAGE_MIN으로만 관리. 하락 추세를 막는 게이트이며 상향은 실측 개선 후 조정.
      - name: coverage gate
        env:
          COVERAGE_MIN: '65'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          below=$(awk -v t="$total" -v m="$COVERAGE_MIN" 'BEGIN {print (t < m) ? 1 : 0}')
          echo "coverage total=${total}% (min=${COVERAGE_MIN}%)"
          if [ "$below" = "1" ]; then
            echo "::error::커버리지 ${total}%가 임계값 ${COVERAGE_MIN}% 미만입니다"
            exit 1
          fi

      - name: build
        run: CGO_ENABLED=0 go build ./...

  # SQL 마이그레이션은 prod 계열 드라이버(postgres/mysql)에서만 동작하므로 실제 DB 서비스로 검증한다.
  # up → version → down → up 사이클로 적용/롤백/재적용을 모두 확인한다.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: migrate
          MYSQL_PASSWORD: migrate
          MYSQL_DATABASE: ci_migrate
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: postgres migrations
        env:
          DB_DRIVER: postgres
          DB_DSN: 'postgres://postgres:postgres@localhost:5432/ci_migrate?sslmode=disable'
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate version
          go run ./cmd/migrate down
          go run ./cmd/migrate up

      - name: mysql migrations
        env:
          DB_DRIVER: mysql
          DB_DSN: 'migrate:migrate@tcp(localhost:3306)/ci_migrate?parseTime=true'
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate version
          go run ./cmd/migrate down
          go run ./cmd/migrate up

  # 실제 DB 위에서 앱 부팅 → 헬스체크 → CRUD 전 주기를 검증한다(E2E 스모크).
  # 마이그레이션 잡과 동일한 서비스 정의를 재사용한다.
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: starter
          MYSQL_PASSWORD: starter
          MYSQL_DATABASE: ci_smoke
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: postgres smoke
        run: ./scripts/smoke.sh postgres 'postgres://postgres:postgres@localhost:5432/ci_smoke?sslmode=disable' 8090

      - name: mysql smoke
        run: ./scripts/smoke.sh mysql 'starter:starter@tcp(localhost:3306)/ci_smoke?parseTime=true' 8091
