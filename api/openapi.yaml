openapi: 3.0.3
info:
  title: go-fiber-starter API
  description: Go + Fiber v3 + GORM 기반 REST API 보일러플레이트. /api/v1 업무 API의 JSON 성공·오류 응답은
    공통 Envelope를 사용한다. 204는 빈 본문이며 health 프로브 JSON, Prometheus 텍스트, OpenAPI YAML은 별도 형식이다.
  version: 1.0.0
servers:
- url: /
paths:
  /livez:
    get:
      summary: Liveness 프로브
      description: 프로세스 생존 확인. DB 장애와 무관하다.
      operationId: livez
      tags:
      - system
      responses:
        '200':
          description: 프로세스 생존
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivezResponse'
  /readyz:
    get:
      summary: Readiness 프로브
      description: DB ping으로 연결 상태를 확인한다. 테이블·마이그레이션 적용 여부는 검사하지 않는다.
      operationId: readyz
      tags:
      - system
      responses:
        '200':
          description: 트래픽 수신 가능
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'
        '503':
          description: 의존성(DB) 준비 안 됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'
  /metrics:
    get:
      summary: Prometheus 메트릭
      operationId: metrics
      tags:
      - system
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
  /openapi.yaml:
    get:
      summary: 이 스펙 문서
      operationId: openapiYaml
      tags:
      - system
      responses:
        '200':
          description: OpenAPI 3.0.3 YAML 원문
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/auth/login:
    post:
      summary: 로그인(JWT 발급)
      description: AUTH_ENABLED=true일 때만 활성화된다. IP별 분당 시도 한도 초과 시 429 RATE_LIMITED.
      operationId: login
      tags:
      - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: admin123
      responses:
        '200':
          description: 발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
        '400':
          description: 본문 파싱 실패(malformed request body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 자격증명 불일치(INVALID_CREDENTIALS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 필드 검증 실패(INVALID_REQUEST, details에 필드별 사유)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 로그인 시도 한도 초과(RATE_LIMITED, IP별 AUTH_RATE_LIMIT_PER_MINUTE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/tasks:
    post:
      summary: Task 생성
      operationId: createTask
      tags:
      - tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            example:
              title: write tests
              due_date: '2030-01-02T03:04:05Z'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
              example:
                success: true
                data:
                  id: 1
                  title: write tests
                  done: false
                  due_date: '2030-01-02T03:04:05Z'
                  created_at: '2026-08-23T00:00:00+09:00'
                  updated_at: '2026-08-23T00:00:00+09:00'
        '400':
          description: 본문 파싱 실패(malformed request body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 필드 검증 실패(INVALID_REQUEST, details에 필드별 사유)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error:
                  code: INVALID_REQUEST
                  message: validation failed
                  details:
                  - field: Title
                    reason: required
        '429':
          description: 전역 rate limit 초과(RATE_LIMITED, IP별 RATE_LIMIT_PER_MINUTE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 인증 실패(UNAUTHORIZED) — AUTH_ENABLED=true일 때만 발생
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - BearerAuth: []
    get:
      summary: Task 목록(offset 페이지네이션)
      operationId: listTasks
      tags:
      - tasks
      parameters:
      - name: page
        in: query
        required: false
        description: 페이지 번호(1 이상, 기본 1)
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        description: 페이지 크기(1~100, 기본 20, 100 초과분은 클램프)
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: 목록과 페이지 메타
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListEnvelope'
        '429':
          description: 전역 rate limit 초과(RATE_LIMITED, IP별 RATE_LIMIT_PER_MINUTE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 인증 실패(UNAUTHORIZED) — AUTH_ENABLED=true일 때만 발생
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - BearerAuth: []
  /api/v1/tasks/{id}:
    get:
      summary: Task 단건 조회
      operationId: getTask
      tags:
      - tasks
      parameters:
      - $ref: '#/components/parameters/TaskID'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '400':
          description: 잘못된 id(INVALID_REQUEST, 양의 정수 필요)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 전역 rate limit 초과(RATE_LIMITED, IP별 RATE_LIMIT_PER_MINUTE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 존재하지 않는 task(TASK_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 인증 실패(UNAUTHORIZED) — AUTH_ENABLED=true일 때만 발생
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - BearerAuth: []
    patch:
      summary: Task 부분 수정(present-field만 반영)
      description: 전달한 필드만 변경한다. due_date에 null을 보내면 해제, 미전달이면 무시.
      operationId: updateTask
      tags:
      - tasks
      parameters:
      - $ref: '#/components/parameters/TaskID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '429':
          description: 전역 rate limit 초과(RATE_LIMITED, IP별 RATE_LIMIT_PER_MINUTE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400':
          description: 본문 파싱 실패 또는 잘못된 id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 존재하지 않는 task(TASK_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 필드 검증 실패(INVALID_REQUEST, details에 필드별 사유)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 인증 실패(UNAUTHORIZED) — AUTH_ENABLED=true일 때만 발생
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - BearerAuth: []
    delete:
      summary: Task 삭제(soft delete)
      operationId: deleteTask
      tags:
      - tasks
      parameters:
      - $ref: '#/components/parameters/TaskID'
      responses:
        '204':
          description: 삭제됨(본문 없음)
        '400':
          description: 잘못된 id(INVALID_REQUEST, 양의 정수 필요)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 전역 rate limit 초과(RATE_LIMITED, IP별 RATE_LIMIT_PER_MINUTE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 존재하지 않는 task(TASK_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 인증 실패(UNAUTHORIZED) — AUTH_ENABLED=true일 때만 발생
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: POST /api/v1/auth/login으로 발급. AUTH_ENABLED=true일 때 /api/v1/tasks에
        요구된다.
  parameters:
    TaskID:
      name: id
      in: path
      required: true
      description: Task 식별자(양의 정수)
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    Envelope:
      type: object
      description: /api/v1 업무 API의 JSON 응답 래퍼. 204 빈 본문과 health·metrics·OpenAPI 형식에는 적용하지 않는다.
        success/data/error/meta 중 해당하는 것만 직렬화된다.
      required:
      - success
      properties:
        success:
          type: boolean
        data:
          description: 성공 시 페이로드. 스키마는 각 응답별 Envelope 참조.
        error:
          $ref: '#/components/schemas/Error'
        meta:
          description: '부가 정보(예: PageMeta). 스키마는 각 응답별 Envelope 참조.'
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 안정적인 에러 식별자. 예 NOT_FOUND, INVALID_REQUEST, TASK_NOT_FOUND,
            INVALID_CREDENTIALS, RATE_LIMITED
        message:
          type: string
        details:
          type: array
          description: 필드별 상세(주로 422 검증 실패). validator ValidationErrors의 Field/ActualTag에서
            온다.
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required:
      - field
      - reason
      properties:
        field:
          type: string
        reason:
          type: string
          description: 위반한 validate 태그(예 required, min, max)
    TaskEnvelope:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/TaskResponse'
    TaskListEnvelope:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
        meta:
          $ref: '#/components/schemas/PageMeta'
    LoginEnvelope:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/LoginResponse'
    ErrorEnvelope:
      type: object
      required:
      - success
      - error
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          $ref: '#/components/schemas/Error'
    CreateTaskRequest:
      type: object
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        due_date:
          type: string
          format: date-time
          nullable: true
    UpdateTaskRequest:
      type: object
      description: 모든 필드 선택적. 전달한 필드만 반영하며 due_date는 null로 명시 해제한다.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        done:
          type: boolean
        due_date:
          type: string
          format: date-time
          nullable: true
    TaskResponse:
      type: object
      required:
      - id
      - title
      - done
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        done:
          type: boolean
        due_date:
          type: string
          format: date-time
          nullable: true
          description: 마감일. 미설정 시 필드가 생략된다(omitempty).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PageMeta:
      type: object
      required:
      - page
      - limit
      - total_count
      - total_pages
      properties:
        page:
          type: integer
        limit:
          type: integer
        total_count:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required:
      - token
      - token_type
      - expires_at
      properties:
        token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_at:
          type: string
          format: date-time
    LivezResponse:
      type: object
      required:
      - status
      - commit
      properties:
        status:
          type: string
          enum:
          - ok
        commit:
          type: string
          description: 빌드 시 -ldflags로 주입된 커밋 식별자(미주입 시 dev)
    ReadyzResponse:
      type: object
      required:
      - status
      - checks
      properties:
        status:
          type: string
          enum:
          - ready
          - unavailable
        checks:
          type: object
          required:
          - database
          properties:
            database:
              type: string
              enum:
              - up
              - down
tags:
- name: system
  description: 프로브/메트릭/스펙
- name: auth
  description: JWT 로그인
- name: tasks
  description: 예제 도메인
